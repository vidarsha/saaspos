name: saaspos
description: "A modern, high-performance SaaS Point of Sale system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.0

  # Backend
  supabase_flutter: ^2.5.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  file_picker: ^8.0.3
  image_picker: ^1.1.0
  path: ^1.9.0

  # Export
  pdf: ^3.11.0
  csv: ^6.0.0
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
